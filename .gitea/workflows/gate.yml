# Gitea 轻量门禁（2026-11-24 操作者裁决 B 方案）
#
# runs-on: bk-gate 是专用 label：.github/workflows 的 macos-latest/ubuntu-latest
# job 在 Gitea 上永远没有匹配 runner，因此不会触发；只有本文件在 Gitea 执行。
#
# 只跑 ci-local 的 Node gate 子集 + cargo check，不跑全量 release build。
# 目的：自动复核 agent 是否真的过了门禁，防止谎报；耗时约 2-3 分钟。
# 全量 release build 仍由 bk-ship.sh 的 CI 门（独立干净 worktree）负责。
#
# 与 .github/workflows/ci.yml 完全独立，不影响 GitHub 侧 CI。
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: fast-gates
    runs-on: bk-gate
    timeout-minutes: 20
    steps:
      - name: checkout
        if: success()
        uses: actions/checkout@v4

      - name: planner gates
        if: success()
        run: |
          set -euo pipefail
          node scripts/dep-direction-check.mjs --self-test
          node scripts/dep-direction-check.mjs
          sh scripts/dep-direction-check-teeth.sh
          node scripts/contract-tree-check.mjs --self-test
          node scripts/contract-tree-check.mjs
          node scripts/store-layer-check.mjs --self-test
          node scripts/store-layer-check.mjs

      - name: core gates (teeth)
        if: success()
        run: |
          set -euo pipefail
          node scripts/intent-audit-check.mjs --teeth
          node scripts/strategy-no-stop-loss-check.mjs --teeth
          node scripts/strategy-declaration-check.mjs --teeth
          node scripts/plugin-modes-check.mjs --teeth
          node scripts/kline-aggregation-check.mjs --teeth
          node scripts/risk-systemic-check.mjs --teeth
          node scripts/account-credential-check.mjs --teeth
          node scripts/account-cross-isolation-check.mjs --teeth
          node scripts/lua-sandbox-check.mjs --teeth
          node scripts/lua-decimal-check.mjs --teeth
          node scripts/thesis-death-check.mjs --teeth

      # core gates (real) 需要 target/release/blitzkrieg-core 二进制，属于全量构建，
      # 不在本轻量门禁范围内；由 bk-ship.sh 的干净 worktree CI 门负责。

      - name: file-size + secret-scan
        if: success()
        run: |
          set -euo pipefail
          node scripts/file-size-check.mjs --self-test
          node scripts/file-size-check.mjs
          bash scripts/secret-scan.sh

      - name: cargo check
        if: success()
        run: cargo check --workspace --all-targets

  auto-merge:
    name: auto-merge
    needs: fast-gates
    if: success() && github.event.pull_request.number != ''
    runs-on: bk-gate
    timeout-minutes: 5
    steps:
      - name: Check R6 boundary and squash-merge via Gitea API
        env:
          GITEA_CRED: ${{ secrets.GITEACRED }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_API: http://192.168.0.153:3000/api/v1/repos/BlitzkriegBot/BlitzkriegBot
        run: |
          set -euo pipefail

          if [ -z "${GITEA_CRED}" ]; then
            echo "ERROR: secrets.GITEACRED is empty" >&2
            exit 1
          fi

          PR_JSON=$(curl -sfS -u "$GITEA_CRED" "${GITEA_API}/pulls/${PR_NUM}")
          PR_STATE=$(printf '%s' "$PR_JSON" | jq -r '.state // ""')
          PR_DRAFT=$(printf '%s' "$PR_JSON" | jq -r '.draft // false')
          PR_MERGEABLE=$(printf '%s' "$PR_JSON" | jq -r '.mergeable // false')
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
          HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r '.head.sha // ""')

          if [ "$PR_STATE" != "open" ]; then
            echo "skipped: PR #${PR_NUM} state is '${PR_STATE}'"
            exit 0
          fi
          if [ "$PR_DRAFT" = "true" ]; then
            echo "skipped: PR #${PR_NUM} is draft"
            exit 0
          fi
          if [ "$PR_MERGEABLE" != "true" ]; then
            echo "skipped: PR #${PR_NUM} is not mergeable (conflict or check pending) — manual rebase required"
            exit 0
          fi

          FILES_JSON=$(curl -sfS -u "$GITEA_CRED" "${GITEA_API}/pulls/${PR_NUM}/files")
          R6_HIT=$(printf '%s' "$FILES_JSON" | jq -r '.[] | select(.filename | test("ledger|RiskGate|risk\.gate|\.env|live|credential|secret")) | .filename' | head -n 1)
          if [ -n "$R6_HIT" ]; then
            echo "skipped: R6 manual-approval boundary touched (${R6_HIT})"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg title "${PR_TITLE} (#${PR_NUM})" \
            --arg msg "Auto-merge PR #${PR_NUM} via gate CI" \
            --arg sha "$HEAD_SHA" \
            '{do: "squash", merge_title_field: $title, merge_message_field: $msg, head_commit_id: $sha, delete_branch_after_merge: true}')

          RESP_FILE=$(mktemp)
          trap 'rm -f "$RESP_FILE"' EXIT
          HTTP_CODE=$(curl -sS -o "$RESP_FILE" -w '%{http_code}' -X POST \
            -u "$GITEA_CRED" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${GITEA_API}/pulls/${PR_NUM}/merge")

          case "$HTTP_CODE" in
            200|204)
              echo "auto-merged PR #${PR_NUM} via squash (HTTP ${HTTP_CODE})"
              ;;
            405|409)
              echo "skipped: Gitea refused merge (HTTP ${HTTP_CODE}): $(cat "$RESP_FILE")"
              exit 0
              ;;
            *)
              echo "ERROR: merge API failed (HTTP ${HTTP_CODE}): $(cat "$RESP_FILE")" >&2
              exit 1
              ;;
          esac
