# Gitea 轻量门禁（2026-11-24 操作者裁决 B 方案）
#
# runs-on: bk-gate 是专用 label：.github/workflows 的 macos-latest/ubuntu-latest
# job 在 Gitea 上永远没有匹配 runner，因此不会触发；只有本文件在 Gitea 执行。
#
# 只跑 ci-local 的 Node gate 子集 + cargo check，不跑全量 release build。
# 目的：自动复核 agent 是否真的过了门禁，防止谎报；耗时约 2-3 分钟。
# 全量 release build 仍由 bk-ship.sh 的 CI 门（独立干净 worktree）负责。
#
# 与 .github/workflows/ci.yml 完全独立，不影响 GitHub 侧 CI。
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: fast-gates
    runs-on: bk-gate
    timeout-minutes: 20
    steps:
      - name: checkout
        if: success()
        uses: actions/checkout@v4

      - name: planner gates
        if: success()
        run: |
          set -euo pipefail
          node scripts/dep-direction-check.mjs --self-test
          node scripts/dep-direction-check.mjs
          sh scripts/dep-direction-check-teeth.sh
          node scripts/contract-tree-check.mjs --self-test
          node scripts/contract-tree-check.mjs
          node scripts/store-layer-check.mjs --self-test
          node scripts/store-layer-check.mjs

      - name: core gates (teeth)
        if: success()
        run: |
          set -euo pipefail
          node scripts/intent-audit-check.mjs --teeth
          node scripts/strategy-no-stop-loss-check.mjs --teeth
          node scripts/strategy-declaration-check.mjs --teeth
          node scripts/plugin-modes-check.mjs --teeth
          node scripts/kline-aggregation-check.mjs --teeth
          node scripts/risk-systemic-check.mjs --teeth
          node scripts/account-credential-check.mjs --teeth
          node scripts/account-cross-isolation-check.mjs --teeth
          node scripts/lua-sandbox-check.mjs --teeth
          node scripts/lua-decimal-check.mjs --teeth
          node scripts/thesis-death-check.mjs --teeth

      # core gates (real) 需要 target/release/blitzkrieg-core 二进制，属于全量构建，
      # 不在本轻量门禁范围内；由 bk-ship.sh 的干净 worktree CI 门负责。

      - name: file-size + secret-scan
        if: success()
        run: |
          set -euo pipefail
          node scripts/file-size-check.mjs --self-test
          node scripts/file-size-check.mjs
          bash scripts/secret-scan.sh

      - name: cargo check
        if: success()
        run: cargo check --workspace --all-targets

  auto-merge:
    name: auto-merge
    needs: fast-gates
    if: success() && github.event.pull_request.number != ''
    runs-on: bk-gate
    timeout-minutes: 10
    steps:
      - name: Check R6 manual-approval boundary
        env:
          GITEA_CRED: ${{ secrets.GITEACRED }}
        run: |
          # Gitea/act runner does not export $GITHUB_OUTPUT, so step outputs are
          # passed through temp files instead (same runner container, persists).
          PR_NUM=${{ github.event.pull_request.number }}
          FILES=$(curl -s -u "$GITEA_CRED" "http://localhost:3000/api/v1/repos/BlitzkriegBot/BlitzkriegBot/pulls/${PR_NUM}/files")
          R6_HIT=$(echo "$FILES" | jq -r '.[] | select(.filename | test("ledger|RiskGate|risk.gate|\\.env|live|credential|secret")) | .filename' | head -1)
          if [ -n "$R6_HIT" ]; then
            echo "R6 boundary touched: $R6_HIT -> skip auto-merge"
            echo "true" > /tmp/auto-merge-skip
          else
            echo "false" > /tmp/auto-merge-skip
          fi

      - name: Checkout main and rebase PR branch
        if: success() && [ "$(cat /tmp/auto-merge-skip 2>/dev/null)" = "false" ]
        env:
          GITEA_CRED: ${{ secrets.GITEACRED }}
        run: |
          git config --global user.name "ceer_quant"
          git config --global user.email "ceer_quant@users.noreply.github.com"
          PR_NUM=${{ github.event.pull_request.number }}
          REPO_DIR=/tmp/bk-auto-merge-$$
          git clone "http://$GITEA_CRED@localhost:3000/BlitzkriegBot/BlitzkriegBot.git" "$REPO_DIR"
          cd "$REPO_DIR"
          git checkout main
          git pull origin main
          git fetch origin pull/${PR_NUM}/head:pr-branch
          git checkout pr-branch
          if git rebase main; then
            echo "true" > /tmp/auto-merge-rebase-ok
            git push origin pr-branch
          else
            echo "false" > /tmp/auto-merge-rebase-ok
            git checkout -b "auto-merge/${PR_NUM}-${{ github.sha }}"
            git add -A 2>/dev/null || true
            git commit -m "chore(auto-merge): rebase conflict for PR #${PR_NUM}" 2>/dev/null || true
            git push origin "auto-merge/${PR_NUM}-${{ github.sha }}"
            curl -s -X PATCH -u "$GITEA_CRED" -H "Content-Type: application/json" \
              -d "{\"head\":\"auto-merge/${PR_NUM}-${{ github.sha }}\"}" \
              "http://localhost:3000/api/v1/repos/BlitzkriegBot/BlitzkriegBot/pulls/${PR_NUM}"
          fi
          rm -rf "$REPO_DIR"

      - name: Squash merge via Gitea API
        if: success() && [ "$(cat /tmp/auto-merge-skip 2>/dev/null)" = "false" ] && [ "$(cat /tmp/auto-merge-rebase-ok 2>/dev/null)" = "true" ]
        env:
          GITEA_CRED: ${{ secrets.GITEACRED }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          curl -s -X POST -u "$GITEA_CRED" -H "Content-Type: application/json" \
            -d '{"merge_style":"squash","commit_message":"Auto-merge PR #${PR_NUM} via gate CI"}' \
            "http://localhost:3000/api/v1/repos/BlitzkriegBot/BlitzkriegBot/pulls/${PR_NUM}/merge"
